<html lang="cs">

<title>Trénink</title>
<style>
/* ---------- tokeny (návrh designera v2) ---------- */
:root{
  --bg:#0b0c0f; --s1:#16181d; --s2:#202329; --sep:rgba(255,255,255,.08);
  --tx:#f5f5f7; --tx2:#9a9ca4; --tx3:#63666e;
  --acc:#c6f432; --onAcc:#0b0c0f;
  --rest:#5aa9ff; --restBg:#0c1622;
  --bad:#ff5c5c;
  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-sheet:28px;
  --safeB:env(safe-area-inset-bottom); --safeT:env(safe-area-inset-top);
  color-scheme:dark; accent-color:var(--acc);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
/* typografie */
.large{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.title{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.title.long{font-size:22px}
.head{font-size:17px;font-weight:600}
.foot{font-size:15px;font-weight:400;color:var(--tx2)}
.cap{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.tx2{color:var(--tx2)} .tx3{color:var(--tx3)} .acc{color:var(--acc)}
h2.cap{margin:32px 4px 8px}
#app{padding:calc(var(--safeT) + 16px) 16px calc(var(--safeB) + 100px);max-width:560px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
/* plochy a seznamy (bez karet v kartách) */
.surf{background:var(--s1);border-radius:var(--r-lg);overflow:hidden;margin:8px 0}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;width:100%;text-align:left}
.surf>.row+.row,.surf>.row+.sub,.surf>.sub+.row{border-top:.5px solid var(--sep)}
.grow{flex:1;min-width:0}
.chev{color:var(--tx3)}
/* tlačítka: 3 úrovně */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-weight:600}
.b1{min-height:72px;border-radius:20px;background:var(--acc);color:var(--onAcc);font-size:20px;font-weight:700}
.b2{min-height:56px;border-radius:var(--r-md);background:var(--s2);font-size:17px}
.b1.rest{background:var(--rest);color:var(--onAcc)}
.b3{min-height:48px;color:var(--tx2);font-size:17px;font-weight:500;width:auto;padding:0 12px}
.b3.danger{color:var(--bad)}
.b3i{display:inline-flex;align-items:center;gap:8px;color:var(--tx);padding-left:4px}
.ib{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.btns{display:flex;gap:8px;align-items:center} .btns>.b2,.btns>.b1{flex:1}
.between{display:flex;justify-content:space-between;align-items:center}
/* týden */
.weekhead{display:flex;align-items:center;justify-content:space-between;margin:0 -8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:4px 0 8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;min-height:76px;position:relative}
.wd .mod{position:absolute;top:0;left:50%;width:10px;height:2px;margin-left:-5px;border-radius:1px;background:var(--tx2)}
.wd .n{font-size:13px;font-weight:500;color:var(--tx2)}
.wd .d{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.wd.today .d{color:var(--acc)}
.wd.sel .d{background:var(--s2)}
.dot{width:6px;height:6px;border-radius:50%;background:transparent}
.dot.done{background:var(--acc)} .dot.missed{background:var(--bad)} .dot.partial{box-shadow:inset 0 0 0 1.5px var(--acc)} .dot.plan{background:var(--tx3)} .dot.off{box-shadow:inset 0 0 0 1.5px var(--tx3)}
.streak{text-align:center;margin:0 0 8px}
/* položky dne */
.check{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--tx3);display:flex;align-items:center;justify-content:center;flex:none;transition:background .25s}
.check.on{background:var(--acc);box-shadow:none;color:var(--onAcc)}
.check svg.i{width:18px;height:18px;stroke-width:3}
.marks{display:flex;justify-content:center;gap:4px;margin:8px 0}
.marks button{min-height:44px;padding:0 14px;border-radius:999px;color:var(--tx2);font-size:15px;font-weight:500}
.marks button.on-done{background:var(--acc);color:var(--onAcc)}
.marks button.on-missed{background:var(--bad);color:#1a0505}
.marks button.on-off{background:var(--s2);color:var(--tx)}
.banner{background:var(--s1);border-radius:var(--r-lg);padding:14px 16px;margin:8px 0;font-size:15px;color:var(--tx2)}
.banner b{color:var(--tx);font-weight:600}
.banner.bad b{color:var(--bad)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(11,12,15,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:4px 8px calc(var(--safeB) + 4px);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--tx2);min-height:52px}
.tabs button.on{color:var(--acc)}
/* průvodce */
.run{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:calc(var(--safeT) + 4px) 16px calc(var(--safeB) + 12px);transition:background .4s}
.run.restbg{background:var(--restBg)}
.run-top{display:flex;align-items:center;gap:8px;min-height:52px}
.run-top .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.run-top .clock{min-width:44px;text-align:right;font-size:15px;color:var(--tx2)}
.bar{width:100%;max-width:200px;height:3px;border-radius:2px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s ease-out}
.run-main{flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;gap:6px;min-height:0;overflow:auto;padding:8px 0}
.run-main>*{flex-shrink:0}.run-main>:first-child{margin-top:auto}.run-main>:last-child{margin-bottom:auto}
.meta{font-size:17px;color:var(--tx2)}
.hint{font-size:15px;color:var(--tx2);min-height:20px}
.hint b{color:var(--acc);font-weight:500}
.ring{width:min(80vw,320px);height:min(80vw,320px);position:relative;margin:12px auto 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .track{stroke:var(--s2)}
.ring .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.timer{font-size:112px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring.pulse circle.prog{animation:pulse .3s ease-out}
@keyframes pulse{50%{stroke-width:8}}
.step{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0}
.step button{width:72px;height:72px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center}
.step .v{min-width:120px}
.step .v .display{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.step.small button{width:56px;height:56px}
.step.small .v{font-size:28px;font-weight:700}
.run-bot{display:flex;flex-direction:column;gap:8px}
.run-bot .next{text-align:center;font-size:15px;color:var(--tx2);min-height:20px}
.feel{display:flex;gap:8px;width:100%;margin-top:16px}
.moods{display:flex;gap:8px;width:100%;margin-top:16px}
.moods button{flex:1;min-height:96px;border-radius:var(--r-md);background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx2);font-weight:600;font-size:15px;transition:color .2s,box-shadow .2s}
.moods svg.i{width:40px;height:40px;stroke-width:1.5}
.moods button.on{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.moods button.pop svg.i{animation:pop .26s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
svg.i.mi{width:16px;height:16px;stroke-width:1.8;vertical-align:-3px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{min-height:36px;padding:0 14px;border-radius:18px;background:var(--s2);color:var(--tx2);font-weight:600;font-size:15px}
.pill.on{background:var(--acc);color:var(--onAcc)}
.pill.ap{display:inline-flex;align-items:center;gap:6px}.pill.ap svg.i{width:16px;height:16px;stroke-width:1.8}
.feel button{flex:1;min-height:56px;border-radius:var(--r-md);background:var(--s2);font-weight:600;color:var(--tx2)}
.feel button.on{background:var(--acc);color:var(--onAcc)}
/* spodní panel */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--s1);width:100%;max-width:560px;margin:0 auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:8px 16px calc(var(--safeB) + 16px);max-height:92dvh;overflow:auto}
.sheet .surf{background:var(--s2)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin:0 -8px 8px}
.sheet-h .head{flex:1;text-align:center}
.sheet-h .b3{min-width:76px}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:13px;font-weight:500;color:var(--tx2);margin:0 4px 6px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;min-height:52px;border-radius:var(--r-md);border:0;background:var(--s2);padding:0 16px;font-size:17px;outline:none}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
textarea.inp{padding:14px 16px;min-height:88px;resize:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--s2);border-radius:var(--r-md);padding:3px;gap:3px}
.seg button{flex:1;min-height:46px;border-radius:13px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--bg);color:var(--tx)}
.tgl{display:flex;align-items:center;min-height:56px;gap:12px}
.tgl input{width:51px;height:31px;flex:none;margin:0}
.ib.sm{width:44px;height:44px}
.list .row{min-height:60px}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:15px}
.chip button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx3)}
.chip button svg.i{width:16px;height:16px}
/* progres */
/* progres */
.pg-big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}.pg-big span{font-size:24px;color:var(--tx2);font-weight:600}
.pg-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:164px}
.pg-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.pg-ic{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);min-height:18px}.pg-ic svg.i{width:18px;height:18px;stroke-width:1.8}
.pg-more{font-size:11px;color:var(--tx2)}
.pg-bar{width:26px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column}.pg-bar i{background:var(--rest);opacity:.5}.pg-bar b{background:var(--acc)}
.pg-dot{width:8px;height:8px;border-radius:50%;margin:4px 0;box-shadow:inset 0 0 0 1.5px var(--tx3);opacity:.5}
.pg-dot.done{background:var(--acc);box-shadow:none;opacity:1}.pg-dot.missed{background:var(--bad);box-shadow:none;opacity:1}.pg-dot.partial{box-shadow:inset 0 0 0 1.5px var(--acc);opacity:1}.pg-dot.plan{background:var(--tx3);box-shadow:none}.pg-dot.off{opacity:1}
.pg-d{font-size:13px;color:var(--tx2);font-weight:500}
.pg-leg{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin-top:12px}.pg-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.pg-mini{display:flex;gap:4px;align-items:flex-end;height:30px}.pg-mini b{width:8px;border-radius:2px;background:var(--acc);opacity:.35}.pg-mini b.cur{opacity:1}
.pg-rec{display:flex;gap:12px;align-items:center;padding:10px 0}.pg-rec+.pg-rec{border-top:.5px solid var(--sep)}
.coach-img{width:100%;border-radius:14px;display:block;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:16px 8px;text-align:center}
.stats>div+div{border-left:.5px solid var(--sep)}
.stats .v{font-size:28px;font-weight:700;letter-spacing:-.02em}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--tx3)}
.bars b{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);opacity:.35;min-height:2px}
.bars .cur b{opacity:1}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:10px 4px;border-top:.5px solid var(--sep);text-align:left;vertical-align:top}
th{color:var(--tx2);font-weight:500;font-size:13px;border-top:0}
td.r,th.r{text-align:right}
.spark{width:100%;height:64px;display:block;margin-top:8px}
.up{color:var(--acc)} .dn{color:var(--tx2)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--safeB) + 84px);background:var(--tx);color:var(--bg);padding:14px 16px;border-radius:var(--r-md);font-weight:600;z-index:60;text-align:center;font-size:15px}
.empty{color:var(--tx3);text-align:center;padding:24px 8px;font-size:15px}
details summary{list-style:none;cursor:pointer} details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<div id="sheet"></div>
<script>
'use strict';
/* =========================================================
   Trénink v2 — osobní PWA. Všechna data jen v tomto zařízení
   (localStorage). Záloha: Plán → Záloha dat.
   ========================================================= */
const KEY = 'trenink.v1';
const DNY = ['Po','Út','St','Čt','Pá','So','Ne'];
const DNY_DLOUHE = ['Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota','Neděle'];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const wIdx = d => (d.getDay() + 6) % 7;
const fmtNum = (n, dec = 2) => n == null || n === '' ? '' : String(Math.round(n * 10 ** dec) / 10 ** dec).replace('.', ',');
const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss); };
const fmtSec = s => s >= 60 ? (s % 60 ? Math.floor(s / 60) + ' min ' + (s % 60) + ' s' : (s / 60) + ' min') : s + ' s';
const fmtDate = k => { const d = parseKey(k); return d.getDate() + '. ' + (d.getMonth() + 1) + '.'; };
const today = () => dkey(new Date());
// délka tréninku bez přestávek mezi částmi (návrat k uloženému tréninku)
const wDur = (w, end) => Math.max(0, (end || w.end || Date.now()) - w.start - (w.breakMs || 0));
// k uloženému tréninku se lze vrátit jen v jeho kalendářní den, dokud nejsou splněné všechny cviky (i „Vyzkoušet“)
const canResume = w => !S.active && w.date === today() && w.ex.some(y => y.sets.length < y.plan.sets);
const pl = (n, one, few, many) => n + ' ' + (n === 1 ? one : n >= 2 && n <= 4 ? few : many);

/* ---------- ikony (jedna sada, tah 2 px) ---------- */
const P_ = {
  cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chart: '<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  l: '<path d="M15 5l-7 7 7 7"/>', r: '<path d="M9 5l7 7-7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
  pause: '<path d="M9 5v14M15 5v14"/>', play: '<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
  skip: '<path d="M6 5l9 7-9 7zM18 5v14"/>',
  up: '<path d="M6 15l6-6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>',
  swap: '<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  share: '<path d="M12 15V3M8 7l4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
};
const I = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P_[n]}</svg>`;

/* ---------- InBody ukazatele ---------- */
// good: 1 = růst je dobrý, -1 = pokles je dobrý, 0 = bez hodnocení
const INBODY = [
  { key: 'vaha', name: 'Hmotnost', unit: 'kg', good: 0, dec: 1 },
  { key: 'ib_smm', name: 'Kosterní svaly', unit: 'kg', good: 1, dec: 1 },
  { key: 'ib_tuk', name: 'Tělesný tuk', unit: 'kg', good: -1, dec: 1 },
  { key: 'ib_pbf', name: 'Tuk', unit: '%', good: -1, dec: 1 },
  { key: 'ib_visc', name: 'Viscerální tuk', unit: 'úroveň', good: -1, dec: 0 },
  { key: 'ib_ecw', name: 'Poměr ECW', unit: '', good: -1, dec: 3 },
  { key: 'ib_phase', name: 'Fázový úhel', unit: '°', good: 1, dec: 1 },
  { key: 'ib_whr', name: 'Pas / boky', unit: '', good: -1, dec: 2 },
  { key: 'ib_bmi', name: 'BMI', unit: '', good: 0, dec: 1 },
  { key: 'ib_score', name: 'InBody skóre', unit: 'b.', good: 1, dec: 0 },
];

/* ---------- výchozí plán (z PDF) ---------- */
function ex(name, o) { return Object.assign({ id: uid(), name, kind: 'reps', sets: 2, reps: 10, repsTo: null, secs: 60, perSide: false, sideLabel: '', load: null, rest: 45, note: '' }, o); }
function defaultMetrics() {
  return [
    { key: 'vaha', name: 'Hmotnost', unit: 'kg' },
    { key: 'pas', name: 'Pas', unit: 'cm' },
    { key: 'boky', name: 'Boky', unit: 'cm' },
    { key: 'stehno', name: 'Stehno', unit: 'cm' },
    { key: 'paze', name: 'Paže', unit: 'cm' },

function drawSparks() {

    const xy = p.map((v, i) => [i / (p.length - 1) * (W - 8) + 4, H - 6 - (v - mn) / rg * (H - 12)]);

async function exportData() {

  const name = 'trenink-zaloha-' + today() + '.json';

    else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

function importData() {

/* =========================================================
   PRŮVODCE TRÉNINKEM
   S.active = { w: záznam, i: cvik, side: 0|1, phase: 'ready'|'work'|'rest'|'switch'|'end',
     deadline, left, paused, readyAt, setStart, sideSecs, cur:{reps,load} }
   Časy se počítají z uloženého termínu, ne z tiků — přežijí zamčení.
   Po návratu z uspání se nic samo nespouští (čeká na klepnutí).
   ========================================================= */
function startWorkout(tplId, date, itemId, oneEx) {
  const t = oneEx ? { name: oneEx.name, items: [oneEx] } : tplById(tplId);
  const base = t ? (tplId === TRIAL ? t.items.filter(e => !e.parked) : t.items) : [];
  if (!base.length) { toast(tplId === TRIAL ? 'Žádný cvik k vyzkoušení (nebo jsou uspané)' : 'Sestava je prázdná'); return; }
  const now = Date.now();
  const snap = (e, trial) => ({ id: e.id, name: e.name, kind: e.kind, plan: JSON.parse(JSON.stringify(e)), sets: [], start: null, end: null, skipped: false, activeMs: 0, trial: trial || undefined });
  // cviky k vyzkoušení (ne uspané) se nabídnou na konci každé sestavy, ať je vyzkoušíš co nejdřív
  const extra = tplId === TRIAL || oneEx ? [] : (tplById(TRIAL)?.items || []).filter(e => !e.parked && !t.items.some(x => x.id === e.id));
  const w = { id: uid(), date, itemId, tplId, tplName: t.name, start: now, end: null,
    ex: base.map(e => snap(e, tplId === TRIAL)).concat(extra.map(e => snap(e, true))) };
  S.active = { w, i: 0, side: 0, phase: 'ready', deadline: null, left: null, paused: false, readyAt: now, curSince: now,
    cur: { reps: base[0].reps, load: base[0].load } };
  save(); openRun();
}
const A = () => S.active;
const P = () => A().w.ex[A().i].plan;
const LIVE = 2000; // ms: přechod se spustí sám, jen když je appka právě na očích
let tickT = null, wakeLock = null, lastBeepSec = null, prevKey = null, prevSec = null;

async function requestWake() {
  try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; if (S.active && $('#run').innerHTML) renderRun(); }); if (S.active && $('#run').innerHTML) renderRun(); } }
  catch (e) { wakeLock = null; }
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; freezePast(); save(); if (S.active && $('#run').innerHTML) { requestWake(); tick(); } else if (!S.active) { render(); askReason(); } else render(); });

/* zvuk */
let actx = null;
let audioUnlocked = false;
// iPhone: zvuk se odemkne jen klepnutím; tichý režim (přepínač) WebAudio ztiší, pokud není zapnuto „i v tichém režimu“
function unlockAudio() {
  try {
    if ('audioSession' in navigator) navigator.audioSession.type = S.settings.soundSilent ? 'playback' : 'auto';
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (!actx) return;
    if (actx.state !== 'running') actx.resume();
    if (!audioUnlocked) { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); audioUnlocked = true; }
  } catch (e) {}
}
// přehraj až po odemčení (první klepnutí na iPhonu)
function whenAudio(fn) { unlockAudio(); if (actx && actx.state !== 'running') actx.resume().then(fn, fn); else fn(); }
function beep(freq = 880, dur = 0.12, vol = 0.35) {
  if (!S.settings.sound || !actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur + 0.02); } catch (e) {}
}
// Zvuky v zápasnickém stylu: klapnutí dřev (jako 10 s před koncem kola v MMA), gong na konci série.
function clack(n = 1, vol = 0.5) {
  if (!S.settings.sound || !actx) return;
  try {
    const len = Math.floor(actx.sampleRate * 0.04), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    for (let k = 0; k < n; k++) {
      const t = actx.currentTime + k * 0.17, src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2300; f.Q.value = 6; g.gain.value = vol * 6;
      src.connect(f).connect(g).connect(actx.destination); src.start(t);
    }
  } catch (e) {}
}
function bell(base, dur, vol) {
  if (!S.settings.sound || !actx) return;
  try {
    const t = actx.currentTime, out = actx.createGain(); out.gain.value = vol; out.connect(actx.destination);
    [[1, 1], [2.01, .5], [2.76, .35], [5.4, .18], [8.9, .08]].forEach(([r, a], i) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = base * r;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur / (1 + i * .6));
      o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.1);
    });
  } catch (e) {}
}
const gong = () => bell(220, 3.2, 0.6);   // konec série
const ding = () => bell(880, 1.2, 0.25);  // konec odpočinku
function endSignal(kind) {
  kind === 'rest' ? ding() : gong();
  setTimeout(() => { const r = $('.ring'); if (r) { r.classList.remove('pulse'); void r.offsetWidth; r.classList.add('pulse'); } }, 30);
}

function openRun() { requestWake(); for (let g = 0; g < 200 && A() && A().deadline && A().deadline <= Date.now(); g++) expire(Date.now()); if (!A()) return; checkStale(); renderRun(); clearInterval(tickT); tickT = setInterval(tick, 250); }
function closeRun() { if (fbT && fbT.t === 'run') fbT = null; clearInterval(tickT); tickT = null; releaseWake(); $('#run').innerHTML = ''; render(); }
const totalSides = e => e.kind === 'time' && e.perSide ? 2 : 1;
function lastActivity(w) { let t = w.start; for (const x of w.ex) for (const s of x.sets) if (s.end > t) t = s.end; return t; }

// Zapomenutý trénink (déle než 3 h bez aktivity): nabídni uložení nebo zahození
function checkStale() {
  const a = A(); if (!a) return;
  const idle = Date.now() - Math.max(lastActivity(a.w), a.readyAt || 0, a.endedAt || 0);
  if (idle < 3 * 3600e3) return;
  const done = a.w.ex.reduce((s, x) => s + x.sets.length, 0);
  sheet(sheetHead('Neuložený trénink', ['closeSheet', 'Pokračovat']) + `<div class="foot" style="margin:4px 4px 16px">${esc(a.w.tplName)} z ${fmtDate(a.w.date)} zůstal otevřený (${done} sérií). Uložit ho s časem podle poslední série, nebo zahodit? Rozpracovaná série se nezapočítá.</div>
    <button class="btn b1" data-a="rSaveStale">Uložit</button><div style="text-align:center;margin-top:16px"><button class="b3 danger" data-a="rDiscard">Zahodit</button></div>`);
}

function beginWork() {
  const a = A(), e = P(), x = a.w.ex[a.i]; const now = Date.now();
  if (!x.start) x.start = now;
  if (a.side === 0) { a.setStart = now; a.sideSecs = []; }
  a.phase = 'work'; a.paused = false; lastBeepSec = null;
  a.deadline = e.kind === 'time' ? now + e.secs * 1000 : null; // opakování: stopky od Startu do „Série hotová“
  save(); renderRun();
}
function finishSet(now, actualSecs) {
  const a = A(), e = P(), x = a.w.ex[a.i];
  now = now || Date.now();
  const live = Date.now() - now < LIVE;
  if (!x.start) x.start = a.readyAt || now;
  if (e.kind === 'time') {
    a.sideSecs = a.sideSecs || [];
    if (a.sideSecs.length <= a.side) a.sideSecs.push(actualSecs != null ? actualSecs : e.secs);
    if (a.side + 1 < totalSides(e)) {
      a.side++; a.phase = 'switch'; a.paused = false;
      a.deadline = null; // druhá strana čeká na klepnutí
      save(); renderRun(); return;
    }
    x.sets.push({ secs: a.sideSecs.reduce((p, q) => p + q, 0), start: a.setStart || now, end: now }); a.sideSecs = [];
  } else {
    x.sets.push({ reps: a.cur.reps, load: a.cur.load, start: a.setStart || a.readyAt || now, end: now }); a.setStart = null;
  }
  x.end = now; a.side = 0; a.phase = 'ready'; a.deadline = null; a.paused = false; a.setStart = null; a.sideSecs = []; // série je hotová, nic rozpracovaného
  // odpočinek cviku běží po každé sérii, i po poslední (= pauza před dalším cvikem); po úplně poslední sérii tréninku ne
  const more = x.sets.length < e.sets;
  const anyLeft = more || nextIdx() !== -1;
  if (e.rest > 0 && anyLeft) { a.phase = 'rest'; a.restNext = !more; a.deadline = now + e.rest * 1000; a.paused = false; lastBeepSec = null; }
  else if (more) { a.phase = 'ready'; a.readyAt = now; }
  else nextExercise(now);
  save(); renderRun();
}
// index dalšího nedokončeného cviku (od aktuálního dál, dokola), -1 = žádný
function nextIdx() {
  const a = A(), n = a.w.ex.length;
  for (let k = 1; k <= n; k++) { const j = (a.i + k) % n, y = a.w.ex[j]; if (j !== a.i && y.sets.length < y.plan.sets && !y.skipped) return j; }
  return -1;
}
// konec odpočinku (doběhl, nebo Pokračovat): další série stejného cviku, nebo přechod na další cvik
function afterRest(ended, live) {
  const a = A(), x = a.w.ex[a.i];
  const toNext = a.restNext || x.sets.length >= x.plan.sets;
  a.restNext = false; a.deadline = null; a.paused = false;
  if (toNext) { nextExercise(ended); return; }
  a.phase = 'ready'; a.readyAt = ended;
}
// Čistý čas na cviku: počítá se jen doba, kdy byl cvik na obrazovce (při přepínání mezi cviky se nesčítá).
function bank(now) {
  const a = A(); now = now || Date.now();
  if (isNum(a.curSince)) { const x = a.w.ex[a.i]; x.activeMs = (x.activeMs || 0) + Math.max(0, now - a.curSince); }
  a.curSince = now;
}
function stopBank(now) { bank(now); A().curSince = null; }

  rLoad: v => { const a = A(); const n = Math.max(0, Math.round(((a.cur.load || 0) + +v) * 10) / 10); a.cur.load = n || null; save(); renderRun(); },
  rSkip: () => { const a = A(); a.w.ex[a.i].skipped = true; Object.assign(a, { phase: 'ready', deadline: null, paused: false, sideSecs: [], setStart: null, side: 0 }); nextExercise(Date.now()); save(); closeSheet(); renderRun(); },
  rList: () => { const a = A(); if (a.phase === 'end') { a.endedAt = null; const k = a.w.ex.findIndex(y => y.sets.length < y.plan.sets); goEx(k >= 0 ? k : 0); save(); renderRun(); } sheetRunList(); },
  rGo: v => { if (+v === A().i && A().phase !== 'end') { closeSheet(); return; } goEx(+v); save(); closeSheet(); renderRun(); },
  rVids: () => { const a = A(); if ((a.phase === 'work' || a.phase === 'rest') && a.deadline && !a.paused) { a.left = a.deadline - Date.now(); a.paused = true; a.deadline = null; save(); renderRun(); } else if (a.phase === 'switch' && a.deadline) { a.deadline = null; save(); renderRun(); }
    const e = P(); sheet(sheetHead('Videa', ['closeSheet', 'Zavřít']) + `<div class="surf list">${(e.videos || []).filter(okUrl).map(u => `<a class="row" data-vid href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="color:var(--tx);text-decoration:none">${I('play')}<span class="grow"><span class="head" style="display:block">${esc(hostLabel(u))}</span><span class="foot" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u)}</span></span>${I('r', 'chev')}</a>`).join('')}</div><div class="foot" style="margin:8px 4px">Video se otevře v aplikaci nebo v Safari. Běžící minutka se pozastaví.</div>`); },
  rSets: v => { const a = A(); const x = a.w.ex[a.i]; x.plan.sets = Math.max(1, x.sets.length, x.plan.sets + +v);
    if (a.phase === 'rest') a.restNext = x.sets.length >= x.plan.sets;
    if (x.sets.length >= x.plan.sets && (a.phase === 'ready' || a.phase === 'rest')) { nextExercise(Date.now()); closeSheet(); }
    else sheetRunList();
    save(); renderRun(); },
  rSecs: v => { const e = P(); e.secs = Math.max(5, e.secs + +v); save(); renderRun(); },
  rMenu: () => sheet(sheetHead('Trénink') + `<div class="surf list"><button class="row" data-a="rList"><span class="grow head">Přehled cviků</span>${I('r', 'chev')}</button><button class="row" data-a="rHide"><span class="grow head">Skrýt (běží dál)</span>${I('r', 'chev')}</button><button class="row" data-a="rEnd"><span class="grow head">Ukončit a uložit</span>${I('r', 'chev')}</button></div><div style="text-align:center;margin-top:24px"><button class="b3 danger" data-a="rDiscard">Zahodit trénink</button></div>`),
  rHide: () => { closeSheet(); closeRun(); },
  rEnd: () => { const ps = partials(Date.now()); if (!ps.length) return endNow(false);
    sheet(sheetHead('Rozpracovaná série', ['closeSheet', 'Zpět']) + `<div class="foot" style="margin:4px 4px 16px">${ps.map(([x, st]) => esc(x.name) + ' · ' + (x.kind === 'time' ? st.secs + ' s' : setTxt('reps', st))).join('<br>')}<br>Započítat do tréninku?</div>
      <button class="btn b1" data-a="rEndKeep">Započítat a ukončit</button><div style="text-align:center;margin-top:16px"><button class="b3" data-a="rEndDrop">Nezapočítat</button></div>`); },
  rEndKeep: () => endNow(true),
  rEndDrop: () => endNow(false),
  rDiscard: () => { if (!confirm(A() && A().resumed ? 'Zahodit pokračování? Dříve uložená část zůstane.' : 'Opravdu zahodit? Nic se neuloží.')) return; S.active = null; save(); closeSheet(); closeRun(); },
  rFinish: () => saveWorkout(),
  rSaveStale: () => { const a = A(); saveWorkout(a.endedAt || Math.max(lastActivity(a.w), a.readyAt || 0, a.setStart || 0)); },
});

/* ---------- start ---------- */
freezePast(); save();
render();
if (S.active) openRun(); else setTimeout(askReason, 600);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
